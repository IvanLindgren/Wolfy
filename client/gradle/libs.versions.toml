# Единый список версий. Ни одна версия не пишется в build.gradle.kts руками:
# иначе две библиотеки одного семейства однажды разъедутся, и разбираться в
# этом придётся по логу компоновщика.

[versions]
kotlin = "2.4.10"
compose = "1.11.1"
# AGP 8, а не 9. Девятая версия вводит новый Android-DSL для KMP, который
# Compose Resources 1.11 ещё не поддерживает: задача копирования шрифтов в
# assets на нём просто не работает, и приложение собирается без шрифтов.
# Вернёмся к 9, когда поддержка появится.
agp = "8.13.2"
coroutines = "1.11.0"
serialization = "1.9.0"
ktor = "3.5.2"
room = "2.8.4"
sqlite = "2.7.0"
# 2.11 требует compileSdk 37, который тянет за собой AGP 9. Пока стоим на
# версии, совместимой с 36.
lifecycle = "2.10.0"
navigation = "2.9.2"
jna = "5.19.1"
androidxActivity = "1.12.0"
# Ядро AndroidX: нужно ради FileProvider — камере снимок передаётся ссылкой.
androidxCore = "1.17.0"
# Минимальная версия Android. 26 (Oreo) выбрана потому, что ниже нет
# поддержки шрифтовых фич, на которых держится газетный набор, а доля
# устройств старше — доли процента.
androidMinSdk = "26"
androidCompileSdk = "36"
androidTargetSdk = "36"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }

# JNA грузит ядро на обеих платформах. На Android она подключается с
# классификатором @aar — там лежат нативные части JNA под все ABI, без
# которых она не запускается.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }

kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version = "2.4.10-2.0.4" }
room = { id = "androidx.room", version.ref = "room" }

# Память демона: сборка Compose Multiplatform с Kotlin-компилятором заметно
# прожорливее обычной Android-сборки, и на значении по умолчанию она падает.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
# Кэш конфигурации выключен: AGP 8 c ним ещё спорит на некоторых задачах
# Compose Resources, а выигрыш в пару секунд того не стоит.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
# Иерархия исходников KMP: общий код Android и Windows живёт в одном наборе.
kotlin.mpp.enableCInteropCommonization=true

# Отдельный vhost Wolfy на общей машине с ISPmanager и Citavuk.
limit_req_zone $binary_remote_addr zone=wolfy_api:10m rate=20r/s;

upstream wolfy_backend {
    server 127.0.0.1:8091;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name wolfy.citavuk.ru;

    root /opt/wolfy/current/web;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    access_log /var/log/nginx/wolfy.access.log;
    error_log /var/log/nginx/wolfy.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json application/wasm image/svg+xml application/manifest+json;

    client_max_body_size 40m;
    client_body_timeout 300s;

    location = /healthz {
        limit_req zone=wolfy_api burst=40 nodelay;
        proxy_pass http://wolfy_backend;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        limit_req zone=wolfy_api burst=40 nodelay;
        proxy_pass http://wolfy_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 420s;
        proxy_read_timeout 420s;
        proxy_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /lexicon/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

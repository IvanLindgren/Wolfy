name: CI and deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  # Ручной production-run не должен быть отменён запоздавшим событием старого
  # push. Старые deploy дополнительно отсекаются проверкой current master.
  group: wolfy-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wolfy
          POSTGRES_PASSWORD: wolfy
          POSTGRES_DB: wolfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wolfy -d wolfy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      WOLFY_TEST_DB_URL: postgres://wolfy:wolfy@127.0.0.1:5432/wolfy?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # APK нужен только для master: в pull request нет production-секретов
      # подписи, а debug-сборку нельзя выдавать как обновление пользователю.
      - name: Set up Java for signed Android release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android NDK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          sdkmanager --install 'ndk;27.0.12077973'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        shell: bash
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Build Android core
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
          tools/build_core.sh android

      - name: Seed shared Citavuk account tables
        shell: bash
        run: psql "$WOLFY_TEST_DB_URL" -v ON_ERROR_STOP=1 -f server/testdata/citavuk_accounts.sql

      - name: Test Rust core
        shell: bash
        run: |
          cargo test --manifest-path core/Cargo.toml --locked
          cargo check --manifest-path core/Cargo.toml --lib --target wasm32-unknown-unknown --no-default-features --features wasm

      - name: Test Go server
        working-directory: server
        shell: bash
        run: |
          go vet ./...
          go test -p 1 ./...

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build browser core
        working-directory: web
        run: npm run core

      - name: Test and build web app
        working-directory: web
        run: |
          npm test
          npm run build

      - name: Install Chromium for production smoke test
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Smoke-test production bundle
        working-directory: web
        run: npm run e2e

      - name: Restore Android release key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.WOLFY_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > client/androidApp/wolfy-release.keystore
          chmod 600 client/androidApp/wolfy-release.keystore

      - name: Build signed Android APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        working-directory: client
        env:
          WOLFY_SIGNING_STOREFILE: androidApp/wolfy-release.keystore
          WOLFY_SIGNING_STOREPASSWORD: ${{ secrets.WOLFY_ANDROID_STORE_PASSWORD }}
          WOLFY_SIGNING_KEYALIAS: ${{ secrets.WOLFY_ANDROID_KEY_ALIAS }}
          WOLFY_SIGNING_KEYPASSWORD: ${{ secrets.WOLFY_ANDROID_KEY_PASSWORD }}
          WOLFY_RELEASE_SERVER_URL: https://wolfy.citavuk.ru
        run: bash ./gradlew --no-daemon :androidApp:assembleRelease

      - name: Build Linux server
        working-directory: server
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o ../release/server/wolfy-server ./cmd/server

      - name: Package production release
        shell: bash
        run: |
          mkdir -p release/web release/apps
          cp -a web/dist/. release/web/
          test -x release/server/wolfy-server
          test -f release/web/index.html
          if [[ "${{ github.event_name }}" != "pull_request" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            version="$(sed -n 's/.*versionName = "\([0-9.]\+\)"/\1/p' client/androidApp/build.gradle.kts)"
            test -n "$version"
            cp client/androidApp/build/outputs/apk/release/androidApp-release.apk "release/apps/Wolfy-$version.apk"
          fi
          tar -C release -czf wolfy-release.tar.gz server web apps

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: wolfy-production-${{ github.sha }}
          path: wolfy-release.tar.gz
          if-no-files-found: error
          retention-days: 14

  desktop_windows_x64:
    name: Windows x64 installer
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Build MSI
        shell: pwsh
        working-directory: client
        env:
          WOLFY_SERVER_URL: https://wolfy.citavuk.ru
        run: |
          .\gradlew.bat --no-daemon :desktopApp:packageMsi
          if (-not (Get-ChildItem desktopApp\build\compose\binaries -Recurse -Filter '*.msi')) { throw 'MSI не создан' }
      - name: Upload Windows x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: wolfy-windows-x64-${{ github.sha }}
          path: client/desktopApp/build/compose/binaries/**/*.msi
          if-no-files-found: error
          retention-days: 14

  desktop_windows_arm64:
    name: Windows ARM64 installer
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # На hosted Windows ARM64 сейчас доступен Temurin 21; приложение
          # всё равно компилируется с jvmTarget 17 и работает на JRE 17+.
          java-version: '21'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Build ARM64 MSI
        shell: pwsh
        working-directory: client
        env:
          WOLFY_SERVER_URL: https://wolfy.citavuk.ru
        run: |
          .\gradlew.bat --no-daemon :desktopApp:packageMsi
          if (-not (Get-ChildItem desktopApp\build\compose\binaries -Recurse -Filter '*.msi')) { throw 'ARM64 MSI не создан' }
      - name: Upload Windows ARM64 installer
        uses: actions/upload-artifact@v4
        with:
          name: wolfy-windows-arm64-${{ github.sha }}
          path: client/desktopApp/build/compose/binaries/**/*.msi
          if-no-files-found: error
          retention-days: 14

  desktop_linux_x64:
    name: Linux x64 package
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
      - name: Set up Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Install Linux package tools
        shell: bash
        run: sudo apt-get update && sudo apt-get install --yes fakeroot
      - name: Build DEB
        shell: bash
        working-directory: client
        env:
          WOLFY_SERVER_URL: https://wolfy.citavuk.ru
        run: |
          bash ./gradlew --no-daemon :desktopApp:packageDeb
          find desktopApp/build/compose/binaries -name '*.deb' -type f -print -quit | grep -q .
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: wolfy-linux-x64-${{ github.sha }}
          path: client/desktopApp/build/compose/binaries/**/*.deb
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: [build, desktop_windows_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://wolfy.citavuk.ru

    steps:
      - name: Checkout deploy script
        uses: actions/checkout@v4

      - name: Verify deployment revision is current master
        shell: bash
        run: |
          current="$(git ls-remote origin refs/heads/master | awk '{print $1}')"
          test "$current" = "$GITHUB_SHA"

      - name: Download tested artifact
        uses: actions/download-artifact@v4
        with:
          name: wolfy-production-${{ github.sha }}

      - name: Download Windows x64 installer
        uses: actions/download-artifact@v4
        with:
          name: wolfy-windows-x64-${{ github.sha }}
          path: windows-x64

      - name: Add Windows installer to production release
        shell: bash
        run: |
          mkdir -p unpacked/apps
          tar -xzf wolfy-release.tar.gz -C unpacked
          installer="$(find windows-x64 -name '*.msi' -type f -print -quit)"
          test -n "$installer"
          version="$(sed -n 's/.*wolfyVersion = "\([0-9.]\+\)"/\1/p' client/desktopApp/build.gradle.kts)"
          test -n "$version"
          cp "$installer" "unpacked/apps/Wolfy-$version.msi"
          tar -C unpacked -czf wolfy-release.tar.gz server web apps

      - name: Configure SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.WOLFY_VDS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.WOLFY_VDS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/wolfy_vds
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/wolfy_vds ~/.ssh/known_hosts

      - name: Upload release
        shell: bash
        env:
          VDS_HOST: ${{ secrets.WOLFY_VDS_HOST }}
          VDS_USER: ${{ secrets.WOLFY_VDS_USER }}
        run: >-
          scp -C -i ~/.ssh/wolfy_vds -o BatchMode=yes
          wolfy-release.tar.gz
          "${VDS_USER}@${VDS_HOST}:/tmp/wolfy-${GITHUB_SHA}.tar.gz"

      - name: Activate release with rollback
        shell: bash
        env:
          VDS_HOST: ${{ secrets.WOLFY_VDS_HOST }}
          VDS_USER: ${{ secrets.WOLFY_VDS_USER }}
        run: >-
          ssh -i ~/.ssh/wolfy_vds -o BatchMode=yes
          "${VDS_USER}@${VDS_HOST}"
          "bash -s -- '${GITHUB_SHA}' '/tmp/wolfy-${GITHUB_SHA}.tar.gz'"
          < deploy/deploy-release.sh

      - name: Verify public HTTPS endpoints
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 6 --retry-delay 3 https://wolfy.citavuk.ru/ -o /dev/null
          curl --fail --silent --show-error --retry 6 --retry-delay 3 https://wolfy.citavuk.ru/healthz
